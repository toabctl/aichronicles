openapi: 3.1.0

info:
  title: aichronicles ingest API
  version: "1.1.0"
  summary: Canonical contract for ingesting AI coding agent session events.
  description: |
    The aichronicles daemon (`aichronicles-api`) accepts JSON envelopes
    describing events from AI coding agents — user prompts, assistant
    replies, tool invocations, session boundaries — and persists them to a
    local SQLite store.

    This spec exists so third-party agents (Crush, Cursor, Opencode,
    Claude Code via the bundled `aichronicles hook` CLI) can publish events
    to the same daemon without reverse-engineering the Go types. It covers
    the ingest contract (`/v1/ingest`, `/v1/healthz`) only; the daemon's
    read and admin routes are an internal interface of the aichronicles
    CLI, web UI and MCP server, documented in `internal/wire`.

    # Transport

    The daemon binds a Unix-domain socket at
    `$XDG_RUNTIME_DIR/aichronicles/api.sock` (override with
    `$AICHRONICLES_API_SOCKET`), mode 0600, with systemd socket-activation
    support. There is no TCP listener by design: the per-user socket is the
    authentication boundary. Requests are HTTP/1.1 over the UDS; the paths
    below are the full request paths.

    # Redaction

    The daemon redacts every envelope server-side before anything reaches
    the store, whatever the envelope's `redaction` field says. Clients MAY
    scrub first and report it in `redaction`; the daemon neither requires
    nor trusts that field, and records its own result.

    # Acceptance is asynchronous

    `200` means the envelope passed validation and is durably queued.
    Redaction, extraction, storage and indexing happen in the background
    shortly after. A queued envelope that keeps failing to process is
    retried and, after 5 attempts, dead-lettered; that outcome is not
    reported back to the client (see the daemon's admin stats).

    # Idempotency

    `event_id` is the idempotency key. Re-POSTing an envelope whose
    `event_id` is already queued or stored returns `200 OK` with
    `ack.deduped = true` and writes nothing. Clients may safely retry.

    # Errors

    Every error the daemon produces is an RFC 7807 `application/problem+json`
    document. A request for a path the daemon does not serve, or with the
    wrong method, gets the HTTP router's plain-text 404 / 405 instead.

servers:
  - url: http://unix
    description: Unix-domain socket at $XDG_RUNTIME_DIR/aichronicles/api.sock

paths:
  /v1/ingest:
    post:
      operationId: ingest
      summary: Accept one envelope
      description: |
        Validates the envelope and queues it for asynchronous processing
        (server-side redaction, extraction, storage, FTS indexing).
        Idempotent on `event_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "200":
          description: Accepted and queued (or recognized as a duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ack"
        "400":
          description: |
            Validation failure: a body that is not well-formed JSON, has
            data after the JSON value, carries unknown fields, or fails
            `Envelope.Validate()`. Nothing is queued.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: |
            Request body exceeds the envelope size limit (128 MiB unless
            `[limits].max_envelope_bytes` is configured).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Storage error. The envelope was not queued; retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            The ingest queue is full (`[limits].ingest_queue_max`, default
            10000 pending envelopes): the daemon is far behind. Nothing is
            queued; retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/healthz:
    get:
      operationId: healthz
      summary: Liveness check
      description: |
        Cheap ping — the handler does not touch the store. Returns 200 for as
        long as the HTTP mux is alive. Use it from systemd health probes and
        client setup scripts.
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]

components:
  schemas:
    Envelope:
      type: object
      description: |
        The wire contract for a single event. The daemon enforces it with
        `events.Envelope.Validate` (`internal/events/envelope.go`); this
        schema documents the same rules and is kept in lockstep with it.
      required:
        - v
        - event_id
        - source_agent
        - source_session_id
        - kind
        - ts_source
        - payload
      additionalProperties: false
      properties:
        v:
          type: integer
          const: 1
          description: Schema version. Currently 1.
        event_id:
          type: string
          format: uuid
          description: |
            Unique identifier for this event, any UUID version (hook-based
            clients use time-ordered UUIDv7; importers derive stable ids).
            Serves as the idempotency key.
        source_agent:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
          description: |
            Stable slug identifying the agent that produced the event.
            Examples: `claude-code`, `crush`, `aider`, `cursor`.
          examples:
            - claude-code
            - crush
        source_agent_version:
          type: string
          description: Optional agent build version (e.g. "2.0.3").
        source_session_id:
          type: string
          minLength: 1
          description: |
            The agent's own session identifier. Combined with `source_agent`
            it forms a stable UUIDv5 session identifier server-side (see
            `events.DeriveSessionID`).
        kind:
          type: string
          minLength: 1
          description: |
            Canonical event kind. The agent-specific wire kind should be
            mapped into this vocabulary before POSTing.
          enum:
            - user_prompt
            - assistant_message
            - tool_use
            - tool_result
            - tool_failure
            - session_start
            - session_end
            - subagent_start
            - subagent_stop
            - compact_start
            - compact_end
            - cwd_changed
            - instructions_loaded
            - system_message
            - error
            - unknown
        role:
          type: string
          description: |
            Convenience hint derived from `kind`. Optional on the wire;
            the server validates against the closed enum when set.
          enum: [user, assistant, tool, system]
        ts_source:
          type: string
          format: date-time
          description: RFC3339 / ISO-8601 timestamp captured by the client.
        cwd:
          type: string
          description: Working directory at event time. Optional but recommended.
        host:
          type: string
          description: Hostname. Optional.
        tool:
          $ref: "#/components/schemas/Tool"
        content_text:
          type: string
          description: |
            Free-form human-readable payload for FTS (prompt, assistant
            reply, tool command). MUST be post-redaction.
        payload:
          type: object
          description: |
            Arbitrary JSON object capturing the agent's native event shape.
            Preserved verbatim so downstream enrichment can recover
            anything not normalized. Redaction rewrites string leaves
            in-place; key structure is preserved.
          additionalProperties: true
        transport:
          type: string
          enum: [hook, import]
          description: |
            How the event reached the daemon. `hook` = pushed in real time
            by a running agent's hook system. `import` = bulk-loaded from
            an on-disk transcript. Used for query-time deduplication when
            both paths supply the same conversation. Optional; any other
            value is rejected.
        redaction:
          $ref: "#/components/schemas/Redaction"
        subagent:
          $ref: "#/components/schemas/Subagent"
        session_id:
          type: string
          format: uuid
          readOnly: true
          description: Server-derived; clients should omit on POST.
        ts_server:
          type: string
          format: date-time
          readOnly: true
          description: Server-assigned receipt timestamp. Omit on POST.

    Tool:
      type: object
      description: |
        Normalized tool invocation metadata. Present when `kind` is
        `tool_use`, `tool_result`, or `tool_failure`.
      properties:
        name:
          type: string
          description: Canonical tool name (e.g. `Bash`, `Read`, `Write`).
        call_id:
          type: string
          description: |
            Agent-assigned call identifier that pairs `tool_use` with its
            matching `tool_result` / `tool_failure`.

    Subagent:
      type: object
      description: |
        The sub-agent thread an event belongs to. Omit for top-level events
        run by the main agent. Events sharing (session, `id`) form one
        thread.
      properties:
        id:
          type: string
          description: Per-session sub-agent identifier emitted by the host.
        type:
          type: string
          description: The sub-agent's role label (e.g. `planner`), when known.

    Redaction:
      type: object
      description: |
        Optional, informational: what credential scrubbing the client ran
        before POSTing. The daemon redacts every envelope server-side
        regardless and records its own result here; it neither requires
        nor trusts this field.
      properties:
        applied:
          type: boolean
          description: |
            Whether the client ran a redactor against the string-valued
            fields of this envelope.
        patterns:
          type: array
          items:
            type: string
          description: |
            Unique, sorted list of detector names that fired during
            scrubbing. Empty when nothing matched. Example values:
            `anthropic_api_key`, `aws_access_key`, `pem_private_key`.

    Ack:
      type: object
      description: |
        Success response for /v1/ingest. `deduped = true` means an envelope
        with this `event_id` was already queued or stored and nothing was
        written; `false` means the envelope was queued.
      required: [event_id, session_id, deduped]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
          description: |
            Server-derived session identifier (`uuidv5(source_agent:
            source_session_id)` under the namespace `aichronicles.local`).
        deduped:
          type: boolean

    Problem:
      type: object
      description: |
        RFC 7807 problem document. The daemon returns this shape for every
        error it produces (see "Errors" above).
      required: [title, status]
      properties:
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          description: HTTP status code echoed for client convenience.
        detail:
          type: string
          description: Longer description. May contain validation-error text.
