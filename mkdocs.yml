site_name: aichronicles
site_description: Capture your AI coding sessions, locally, with secrets scrubbed before they hit disk.
site_author: Thomas Bechtold
# repo_url and edit_uri get filled in once the repo lives on GitHub.
# Pages still renders without them; the "Edit on GitHub" link just stays hidden.
# repo_url: https://github.com/toabctl/aichronicles
# edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant       # SPA-style nav, no full reload between pages
    - navigation.tracking      # update URL anchor as the reader scrolls
    - navigation.sections      # group sidebar by section header
    - navigation.path          # show breadcrumbs above the page title
    - toc.follow               # right-side TOC scrolls with the reader
    - content.code.copy        # copy button on code blocks
    - content.code.annotate    # hover annotations on (1)-style markers
    - content.action.edit      # "Edit on GitHub" link if repo_url set
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

# Source files live in docs/. The CLI reference under docs/reference/cli/
# and the schema/detectors pages under docs/reference/ are auto-generated
# by `make docs` — see tools/docgen/main.go. Don't edit them by hand.
docs_dir: docs

nav:
  - Home: index.md
  - Tutorials:
      - Get started: tutorials/getting-started.md
      - Your first summary: tutorials/first-summary.md
  # - How-to:                  # populated as recipes land
  #     - Switch providers: how-to/switch-providers.md
  #     - Backfill historical sessions: how-to/backfill-historical-sessions.md
  #     - Audit and scrub: how-to/audit-and-scrub-the-store.md
  #     - Register with Claude Code: how-to/register-with-claude-code.md
  #     - Inspect stored summaries: how-to/inspect-stored-summaries.md
  - Reference:
      - CLI: reference/cli/index.md
      - Schema: reference/schema.md
      - Detectors: reference/redaction-detectors.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Data flow: explanation/data-flow.md
      - Threat model: explanation/threat-model.md

plugins:
  - search
  # include-markdown lets docs/index.md pull from README.md so we keep
  # one source of truth for the homepage pitch. README is what GitHub
  # renders; the website renders the same content via this transclusion.
  - include-markdown

markdown_extensions:
  - admonition                         # !!! note / !!! warning blocks
  - attr_list                          # {.class} attribute syntax
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true                  # anchor link icon next to each heading
  - pymdownx.details                   # collapsible blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid                # render ```mermaid blocks via mermaid.js
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true            # tabbed code samples (e.g. fish/bash/zsh)
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false                     # hides the "Made with Material for MkDocs" footer
