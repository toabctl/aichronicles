[extend]
useDefault = true

# internal/redact/redact_test.go exists specifically to unit-test our
# credential detectors, so it contains synthetic versions of exactly
# the patterns gitleaks looks for. Allowlisting the single file avoids
# us having to obfuscate the fixtures (which would dilute their value
# as test data). Fixtures must remain synthetic — no live secrets.
[[allowlists]]
paths = [
  '''internal/redact/redact_test\.go''',
  # Auto-generated detector reference reproduces our own regex
  # patterns inline so users can inspect what each one catches. The
  # patterns themselves match the same shapes gitleaks looks for —
  # by design — so the file would otherwise trip on its own table.
  '''docs/reference/redaction-detectors\.md''',
]
