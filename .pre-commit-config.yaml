default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Tier 1 — sub-millisecond text / syntax checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending

  # Tier 2 — fast Go formatters (~10s of ms)
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: goimports
        name: goimports
        entry: goimports -w -local github.com/toabctl/aichronicles
        language: system
        types: [go]

  # Tier 3 — medium Go checks (~100s of ms)
  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '(\.go|go\.mod|go\.sum)$'
        pass_filenames: false
      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false

  # Tier 4 — secret scan (~seconds)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Tier 5 — heavy static analysis (~seconds)
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout 3m
        language: system
        types: [go]
        pass_filenames: false

  # Tier 6 — vulnerability scan (slowest; network + DB)
  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        types: [go]
        pass_filenames: false

  # Tier 7 — unit tests + coverage summary
  - repo: local
    hooks:
      - id: go-test
        name: go test -cover
        entry: bash -c 'go test -coverprofile=/tmp/aichronicles-cover.out -timeout 60s ./... && go tool cover -func=/tmp/aichronicles-cover.out | tail -1'
        language: system
        types: [go]
        pass_filenames: false
        verbose: true       # always print so the coverage total is visible

  # Tier 8 — integration tests (real UDS listener, ingest CLI end-to-end)
  - repo: local
    hooks:
      - id: go-test-integration
        name: go test -tags=integration
        entry: go test -tags=integration -timeout 120s ./integration/...
        language: system
        types: [go]
        pass_filenames: false

  # commit-msg stage (runs on message, not files — ordering irrelevant)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - test
          - chore
          - perf
          - build
          - ci
          - revert
